name: GKM V374.1 Catalog Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gkm_v364_catalog_control.yml"
      - "tools/gkm_v364_integrity_speed.py"
      - "tools/gkm_v364_build_poster_atlas.py"
      - "tools/gkm_v349_repair_static_pages.py"
      - "tools/gkm_v366_russian_title_control.py"
      - "data/catalog_repairs_v364.json"
      - "data/manual_catalog_v364.json"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: gkm-v364-catalog-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout current catalog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install atlas dependency
        run: python -m pip install --disable-pip-version-check pillow==12.0.0

      - name: Verify and synchronize Russian titles
        run: python tools/gkm_v366_russian_title_control.py

      - name: Bake repairs, search shards and full health report
        run: python tools/gkm_v364_integrity_speed.py

      - name: Rebuild balanced poster atlas when catalog changed
        run: python tools/gkm_v364_build_poster_atlas.py --target 400 --workers 12 --timeout 30

      - name: Static release gate
        run: |
          node --check app.js
          node --check ai_search_worker_v343.js
          node --check ai_search_worker_v344.js
          node --check sw.js
          python -m py_compile \
            tools/build_fast_site_data.py \
            tools/gkm_v349_repair_static_pages.py \
            tools/gkm_v364_integrity_speed.py \
            tools/gkm_v364_build_poster_atlas.py \
            tools/gkm_v366_russian_title_control.py
          python tools/gkm_v366_russian_title_control.py --check
          python tools/gkm_v364_integrity_speed.py --check
          grep -q "GKM_V343_HUMAN_AI_WEATHER" app.js
          grep -q "GKM_V364_BALANCED_POSTER_ATLAS_VERSION" app.js
          grep -q "GKM_V367_RUSSIAN_TITLE_CONTROL_VERSION" app.js
          grep -q "GKM_V367_FRANCHISE_IDENTITY_VERSION" app.js
          grep -q "GKM_V368_FRESH_SHELL_FAMILY_TITLES_VERSION" app.js
          grep -q "GKM_V369_ORDER_BADGE_LAYOUT_VERSION" app.js
          grep -q "GKM_V370_UNIQUE_CATALOG_CONTROL_VERSION" app.js
          grep -q "GKM_V371_MOBILE_CARDS_TOUCH_CANVAS_DOCK_VERSION" app.js
          grep -q "GKM_V373_MOBILE_DISCOVERY_VERSION" app.js
          grep -q "GKM_V374_ANIME_LIST_COMMUNITY_VERSION" app.js
          grep -q "GKM_V3741_MOBILE_WEATHER_VERSION" app.js
          ! grep -qi "cylinderGeometry" app.js

      - name: Commit verified V374.1 data
        run: |
          git config user.name "gkm-v364-control"
          git config user.email "gkm-v364-control@users.noreply.github.com"
          # py_compile is validation only. Restore tracked bytecode so the
          # generated catalog commit remains clean before pull --rebase.
          git restore --worktree -- tools/__pycache__ 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          for path in Path("tools").rglob("*.pyc"):
              path.unlink()
          PY
          git add \
            data/catalog_repairs_v364.json \
            data/manual_catalog_v364.json \
            data/fast \
            film/*.html \
            TEST_REPORT_V364_INTEGRITY_SPEED.json \
            TEST_REPORT_V364_POSTER_ATLAS.json \
            TEST_REPORT_V367_RUSSIAN_TITLES.json
          # Some control scripts also refresh already tracked catalog files.
          # Stage those changes too, otherwise pull --rebase refuses a dirty tree.
          git add -u
          if git diff --cached --quiet; then
            echo "Catalog is already healthy"
            exit 0
          fi
          git commit -m "Apply V374.1 mobile AI weather fix"
          git pull --rebase --autostash origin main
          git push origin main
