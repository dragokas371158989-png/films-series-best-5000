name: Build fast site data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "data/**"
      - "tools/build_fast_site_data.py"

permissions:
  contents: write

jobs:
  build-fast-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build fast data
        run: |
          python tools/build_fast_site_data.py

      - name: Commit fast data
        run: |
          git config user.name "fast-data-bot"
          git config user.email "fast-data-bot@users.noreply.github.com"
          git add data/fast
          git diff --cached --quiet || git commit -m "Build fast site data"
          git push
