name: Build fast site data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fast-site-data
  cancel-in-progress: true

jobs:
  build-fast-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync branch
        run: git pull --rebase origin main

      - name: Verify V57 post-fix exists
        run: |
          test -f tools/post_fix_fast_data.py
          grep -n "v71-pager-buffer-no-search-tested-2026-06-13" tools/post_fix_fast_data.py

      - name: Build fast data
        run: python tools/build_fast_site_data.py

      - name: Force post-fix fast data
        run: python tools/post_fix_fast_data.py

      - name: Verify fixed meta
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/fast/meta.json',encoding='utf-8'))
          print(m.get('builderVersion'), m.get('dedupeRemovedPostFix'), m.get('checks'))
          assert m.get('builderVersion') == 'v71-pager-buffer-no-search-tested-2026-06-13'
          assert m.get('checks',{}).get('scoobyInAnime') == 0
          PY

      - name: Commit fast data
        run: |
          git config user.name "fast-data-bot"
          git config user.email "fast-data-bot@users.noreply.github.com"
          git add data/fast
          if git diff --cached --quiet; then
            echo "No fast data changes"
            exit 0
          fi
          git commit -m "Build fast site data v57"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push failed, retry $i"
            sleep 5
          done
