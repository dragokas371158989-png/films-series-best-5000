name: GKM V3450 Russianize and Deduplicate Entire Site

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gkm-v3450-russianize-dedupe
  cancel-in-progress: false

jobs:
  russianize-and-dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create safety backup branch
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-before-v3450-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"
          echo "BACKUP_BRANCH=$BACKUP" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run full Russian localization and deduplication
        shell: bash
        run: |
          set -euo pipefail
          python tools/gkm_v3450_russianize_dedupe.py .

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check features_v344.js
          node --check ai_search_worker_v344.js

      - name: Validate JSON and Russian coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, glob, re, collections, sys
          bad=[]
          for path in glob.glob('data/**/*.json', recursive=True):
              try:
                  json.load(open(path, encoding='utf-8'))
              except Exception as exc:
                  bad.append((path, str(exc)))
          if bad:
              print(bad[:20])
              raise SystemExit(f'Broken JSON files: {len(bad)}')

          items=[]
          for path in glob.glob('data/chunk_*.json'):
              items.extend(json.load(open(path, encoding='utf-8')))
          cyr=re.compile(r'[А-Яа-яЁё]')
          no_ru=[x for x in items if not cyr.search(str(x.get('ru','')))]
          if no_ru:
              print(no_ru[:10])
              raise SystemExit(f'Items without Russian display title: {len(no_ru)}')

          ids=collections.Counter(str(x.get('id') or '') for x in items)
          duplicate_ids=[(k,v) for k,v in ids.items() if k and v>1]
          if duplicate_ids:
              print(duplicate_ids[:20])
              raise SystemExit(f'Duplicate IDs remain: {len(duplicate_ids)}')

          search=json.load(open('data/fast/search_index.json', encoding='utf-8'))
          no_ru_search=[x for x in search if not cyr.search(str(x.get('ru','')))]
          if no_ru_search:
              print(no_ru_search[:10])
              raise SystemExit(f'Search rows without Russian display title: {len(no_ru_search)}')

          print('JSON: PASS')
          print('Primary items:', len(items))
          print('Search rows:', len(search))
          print('Russian titles: PASS')
          print('Duplicate IDs: PASS')
          PY

      - name: Commit V3450 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply V3450 full Russian localization and deduplication"
          git push origin HEAD:main

      - name: Summary
        shell: bash
        run: |
          echo "### GKM V3450 completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Backup branch: \`${BACKUP_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: \`TEST_REPORT_V3450_RUSSIAN_DEDUPE.json\`" >> "$GITHUB_STEP_SUMMARY"
