name: Собрать базу Anime TV

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Сколько страниц Jikan забрать. 40 = примерно 1000 аниме, 200 = примерно 5000 аниме"
        required: true
        default: "200"

permissions:
  contents: write

jobs:
  build-anime-db:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Собрать anime_data.json
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          PAGES = int("${{ github.event.inputs.pages }}")
          OUT = Path("anime-tv/anime_data.json")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          def get_json(url, retries=5):
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "GolubAnimeTV/1.0"}
                      )
                      with urllib.request.urlopen(req, timeout=40) as r:
                          return json.loads(r.read().decode("utf-8"))
                  except Exception as e:
                      print(f"Ошибка запроса: {e}")
                      if attempt == retries - 1:
                          raise
                      time.sleep(5 + attempt * 3)

          def pick_image(item):
              images = item.get("images") or {}
              webp = images.get("webp") or {}
              jpg = images.get("jpg") or {}

              return (
                  webp.get("large_image_url")
                  or webp.get("image_url")
                  or jpg.get("large_image_url")
                  or jpg.get("image_url")
                  or ""
              )

          def names(items):
              return [x.get("name") for x in items or [] if x.get("name")]

          anime = []
          seen = set()

          for page in range(1, PAGES + 1):
              url = f"https://api.jikan.moe/v4/top/anime?page={page}&limit=25&sfw=true"
              print(f"Загружаю страницу {page}/{PAGES}: {url}")

              data = get_json(url)
              items = data.get("data") or []

              if not items:
                  print("Пустая страница, стоп.")
                  break

              for item in items:
                  mal_id = item.get("mal_id")

                  if not mal_id or mal_id in seen:
                      continue

                  seen.add(mal_id)

                  year = (
                      item.get("year")
                      or ((item.get("aired") or {}).get("prop") or {}).get("from", {}).get("year")
                      or ""
                  )

                  anime.append({
                      "id": mal_id,
                      "ru": item.get("title") or item.get("title_english") or item.get("title_japanese") or "Без названия",
                      "en": item.get("title_english") or item.get("title") or "",
                      "jp": item.get("title_japanese") or "",
                      "год": str(year) if year else "",
                      "тип": item.get("type") or "",
                      "эпизоды": item.get("episodes") or "",
                      "статус": item.get("status") or "",
                      "студия": ", ".join(names(item.get("studios"))),
                      "рейтинг": item.get("score") or 0,
                      "постер": pick_image(item),
                      "жанры": names(item.get("genres")) + names(item.get("explicit_genres")) + names(item.get("themes")) + names(item.get("demographics")),
                      "описание": item.get("synopsis") or "",
                      "source": "jikan",
                      "url": item.get("url") or ""
                  })

              time.sleep(1.3)

          anime.sort(
              key=lambda x: (
                  float(x.get("рейтинг") or 0),
                  int(x.get("год") or 0) if str(x.get("год") or "").isdigit() else 0
              ),
              reverse=True
          )

          result = {
              "version": 1,
              "count": len(anime),
              "anime": anime
          }

          OUT.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")

          print(f"Готово. Сохранено аниме: {len(anime)}")
          print(f"Файл: {OUT}")
          PY

      - name: Сохранить базу в репозиторий
        run: |
          git config user.name "anime-tv-db-bot"
          git config user.email "anime-tv-db-bot@users.noreply.github.com"

          git add anime-tv/anime_data.json

          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "Обновить базу Anime TV"
            git pull --rebase origin main
            git push
          fi
