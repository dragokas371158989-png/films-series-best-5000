name: GKM V3453.1 Sync Russian Cache After Daily Update

on:
  workflow_run:
    workflows:
      - GKM V344 Safe Daily Catalog Update
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gkm-v3453-1-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reapply completed Russian caches
        run: python tools/gkm_v3453_1_sync_after_update.py

      - name: Compact rebuilt search indexes
        run: python tools/gkm_v3460_compact_search_index.py

      - name: Validate and commit synchronized site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(
              Path("TEST_REPORT_V3453_1_FULL_RUSSIAN.json").read_text(encoding="utf-8")
          )
          stats=report["stats"]
          assert stats["untranslated_titles_after"] == 0
          assert stats["untranslated_descriptions_after"] == 0
          assert stats["english_genres_after"] == 0
          assert stats["duplicate_ids_after"] == 0

          full=Path("data/fast/search_index.json")
          lite=Path("data/fast/search_lite.json")
          limit=94 * 1024 * 1024

          assert full.exists() and full.stat().st_size < limit, full.stat().st_size
          assert lite.exists() and lite.stat().st_size < limit, lite.stat().st_size

          print("Russian synchronization validation: PASS")
          print("search_index:",round(full.stat().st_size/1024/1024,2),"MiB")
          print("search_lite:",round(lite.stat().st_size/1024/1024,2),"MiB")
          PY

          echo "Largest files after Russian synchronization:"
          python - <<'PY'
          from pathlib import Path

          limit=94 * 1024 * 1024
          files=[]

          for root in ("data","film","anime-tv"):
              base=Path(root)
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      size=path.stat().st_size
                  except OSError:
                      continue
                  files.append((size,path.as_posix()))

          files.sort(reverse=True)

          for size,path in files[:20]:
              print(f"{size/1024/1024:.2f} MiB  {path}")

          oversized=[(size,path) for size,path in files if size >= limit]
          if oversized:
              print("::error::Files exceed the 94 MiB safety limit:")
              for size,path in oversized:
                  print(f"{size/1024/1024:.2f} MiB  {path}")
              raise SystemExit(1)

          print("Russian synchronization file-size gate: PASS")
          PY

          git config user.name "gkm-v3453-1-sync-bot"
          git config user.email "gkm-v3453-1-sync-bot@users.noreply.github.com"

          echo "All generated changes before commit:"
          git status --short

          # The localization script also updates root-level derived JSON files.
          # Stage every generated repository change so rebase never sees leftovers.
          git add -A
          git add tools/gkm_v3460_compact_search_index.py

          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi

          echo "Staged synchronization changes:"
          git diff --cached --stat

          git commit -m "Reapply V3453.1 Russian localization after catalog update"

          # Nothing may remain outside the commit before rebase.
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Additional generated files appeared after commit; including them:"
            git status --short
            git add -A
            git commit --amend --no-edit
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is still not clean before rebase"
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "::error::Rebase conflict while publishing Russian synchronization"
              git status --short || true
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Russian synchronization published successfully"
              exit 0
            fi

            sleep $((attempt * 8))
          done

          echo "::error::Could not push Russian synchronization after 5 attempts"
          exit 1
