name: GKM V3460 Stable Core Health Audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - GKM V344 Safe Daily Catalog Update
      - GKM V3453.1 Full Russian Site and Genre Fix
      - GKM V3453.1 Sync Russian Cache After Daily Update
      - GKM V3454 Rebuild Anime Top and Studios
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: gkm-v3460-health-audit
  cancel-in-progress: true

jobs:
  audit:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate V3460 health snapshot
        run: python tools/gkm_v3460_health_audit.py

      - name: Commit health page and report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gkm-v3460-health-bot"
          git config user.email "gkm-v3460-health-bot@users.noreply.github.com"

          git add \
            health.html \
            data/health_v3460.json \
            TEST_REPORT_V3460_HEALTH.json \
            tools/gkm_v3460_health_audit.py \
            .github/workflows/gkm_v3460_health_audit.yml

          if git diff --cached --quiet; then
            echo "Health snapshot has no changes"
            exit 0
          fi

          git commit -m "Update V3460 stable-core health report"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep 6
          done
          exit 1

      - name: Build summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path=Path("data/health_v3460.json")
          if not path.exists():
              print("### V3460 health report was not generated")
              raise SystemExit()

          data=json.loads(path.read_text(encoding="utf-8"))
          s=data.get("summary",{})
          print("### GKM V3460 Stable Core")
          print()
          print(f"**Status:** `{data.get('status')}`")
          print(f"- Catalog: {s.get('catalogRecords',0)}")
          print(f"- 3D wall: {s.get('posterWallRecords',0)}")
          print(f"- Untranslated titles: {s.get('untranslatedTitles',0)}")
          print(f"- Latin genres: {s.get('latinGenres',0)}")
          print(f"- Duplicate IDs: {s.get('duplicateIds',0)}")
          print(f"- Critical failures: {s.get('criticalFailures',0)}")
          print()
          print("Live page: `health.html`")
          PY

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gkm-v3460-health-report
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/health_v3460.json
            TEST_REPORT_V3460_HEALTH.json
