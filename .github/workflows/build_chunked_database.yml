name: Сборка базы кусками 100000

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chunked-db:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Получить доступ к репозиторию
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Собрать базу кусками
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TARGET_COUNT: "100000"
          CHUNK_SIZE: "1000"
        run: python tools/build_chunked_database.py

      - name: Сохранить data
        run: |
          git config user.name "chunked-db-bot"
          git config user.email "actions@github.com"

          git add data index.html app.js
          git diff --cached --quiet && echo "Нет изменений" || git commit -m "Собрать базу кусками"

          git pull --rebase origin main
          git push origin main
