name: GKM V3453.1 Sync Russian Cache After Daily Update

on:
  workflow_run:
    workflows:
      - GKM V344 Safe Daily Catalog Update
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gkm-v3453-1-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reapply completed Russian caches
        run: python tools/gkm_v3453_1_sync_after_update.py

      - name: Validate and commit synchronized site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(
              Path("TEST_REPORT_V3453_1_FULL_RUSSIAN.json").read_text(encoding="utf-8")
          )
          stats=report["stats"]
          assert stats["untranslated_titles_after"] == 0
          assert stats["english_genres_after"] == 0
          assert stats["duplicate_ids_after"] == 0
          PY

          git config user.name "gkm-v3453-1-sync-bot"
          git config user.email "gkm-v3453-1-sync-bot@users.noreply.github.com"
          git add data film anime-tv TEST_REPORT_V3453_1_FULL_RUSSIAN.json
          if git diff --cached --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git commit -m "Reapply V3453.1 Russian localization after catalog update"
          git pull --rebase origin main
          git push origin HEAD:main
