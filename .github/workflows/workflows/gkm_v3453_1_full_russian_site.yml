name: GKM V3453.1 Full Russian Site and Genre Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gkm-v3453-1-full-russian
  cancel-in-progress: false

jobs:
  russianize:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create backup branch
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="backup-before-v3453-1-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"
          echo "BACKUP_BRANCH=$BACKUP" >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Argos model and translation cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
            data/ru_machine_cache_v3453_1.json
          key: gkm-v3453-1-argos-${{ runner.os }}-${{ hashFiles('tools/gkm_v3453_1_full_russianize_dedupe.py') }}
          restore-keys: |
            gkm-v3453-1-argos-${{ runner.os }}-
            argos-en-ru-v3453

      - name: Install offline Russian translator
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate

      - name: Translate entire site and normalize all genres
        run: python tools/gkm_v3453_1_full_russianize_dedupe.py

      - name: Validate JavaScript, JSON and full Russian taxonomy
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check features_v344.js
          node --check ai_search_worker_v344.js

          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(
              Path("TEST_REPORT_V3453_1_FULL_RUSSIAN.json").read_text(encoding="utf-8")
          )
          stats=report["stats"]

          assert stats["untranslated_titles_after"] == 0, stats
          assert stats["untranslated_descriptions_after"] == 0, stats
          assert stats["english_genres_after"] == 0, stats
          assert stats["duplicate_ids_after"] == 0, stats
          assert all(value["pass"] for value in report["controls"].values()), report["controls"]

          for path in Path("data").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          print("V3453.1 validation: PASS")
          print("Unknown genres translated:",stats.get("unknown_genres_machine_translated",0))
          print("Latin fragments cyrillized:",stats.get("genre_latin_fragments_cyrillized",0))
          PY

      - name: Commit complete Russian site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gkm-v3453-1-bot"
          git config user.email "gkm-v3453-1-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply V3453.1 full Russian genre normalization"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload report and translation caches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gkm-v3453-1-report-and-caches
          if-no-files-found: warn
          retention-days: 14
          path: |
            TEST_REPORT_V3453_1_FULL_RUSSIAN.json
            data/ru_complete_cache_v3453_1.json
            data/ru_machine_cache_v3453_1.json

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### GKM V3453.1" >> "$GITHUB_STEP_SUMMARY"
          echo "Backup: \`${BACKUP_BRANCH:-not-created}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: \`TEST_REPORT_V3453_1_FULL_RUSSIAN.json\`" >> "$GITHUB_STEP_SUMMARY"
